name: Taeglicher Digest

on:
  schedule:
    # 05:40 UTC = 07:40 Berlin (Sommerzeit). Im Winter eine Stunde frueher.
    - cron: "40 5 * * 1-5"
  workflow_dispatch:        # Knopf zum manuellen Starten

permissions:
  contents: write           # damit der Stand in data/ zurueckgeschrieben werden kann

jobs:
  digest:
    runs-on: ubuntu-latest
    # Der Lauf wartet nach dem Senden bis zu FREIGABE_MINUTEN (config.py,
    # 300) auf die Freigabe, davor braucht der Bau rund 15 Minuten, danach
    # der Upload bis zu 10. Der Deckel muss darueber liegen, sonst schneidet
    # er die Wartezeit ab und die Antwort geht ins Leere. Hoechstwert bei
    # GitHub sind 360.
    timeout-minutes: 350
    # Nie zwei Laeufe gleichzeitig: beide wuerden getUpdates abfragen, und
    # Telegram liefert jeden Knopfdruck nur an einen davon.
    concurrency:
      group: digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Lauf
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
          # Optional: ohne Key bleibt das Cover rein typografisch.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Fuer den Upload nach der Freigabe. Fehlen sie, laeuft
          # alles bis zur Frage - nur das Posten scheitert.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          # Sonst puffert Python die Ausgabe bis zum Ende, und im Log traegt
          # jede Zeile denselben Zeitstempel - man sieht nicht, wann die Frage
          # kam und wann die Antwort.
          PYTHONUNBUFFERED: "1"
        run: python run.py

      # Beides gehoert zurueck ins Repo: seen.json, damit keine Meldung zweimal
      # kommt, und cover_state.json, damit die Cover-Rotation nicht nach jedem
      # Lauf wieder bei null anfaengt und zweimal dieselbe Architektur zieht.
      - name: Stand merken
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          # -A statt zweier Pfade: bricht ein Lauf ab, bevor cover_state.json
          # geschrieben ist, wuerde "git add <fehlende Datei>" den Schritt
          # kippen und auch seen.json nicht mehr sichern.
          git add -A data/
          git diff --staged --quiet || git commit -m "stand: $(date -u +%F)"
          # Nach Stunden Wartezeit steht main womoeglich weiter.
          git pull --rebase --autostash
          git push
